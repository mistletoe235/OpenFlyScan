[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openflyscan"
version = "0.1.0.dev0"
description = "Quality-guided aerial reconstruction: Quality Predictor training and evaluation"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy>=1.26", "scipy>=1.11", "Pillow>=10", "opencv-python-headless>=4.8"]

[project.optional-dependencies]
test = ["pytest>=8"]
server = ["aiohttp>=3.9", "jsonschema>=4", "typing_extensions>=4"]

[project.scripts]
openflyscan-server = "openflyscan.server.http:main"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*.txt"]

[tool.setuptools.package-data]
"openflyscan.server" = ["static/*"]

[tool.setuptools.packages.find]
include = ["openflyscan*"]
